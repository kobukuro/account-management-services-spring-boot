name: Notification Service

on:
  pull_request:
    paths:
      - '.github/workflows/notification-service.yml'
      - 'notification-service/**'
  push:
    branches: [ main, dev ]
    paths:
      - '.github/workflows/notification-service.yml'
      - 'notification-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./notification-service

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Docker Compose
        run: docker compose -f docker-compose-ci.yml up -d

      - name: Wait for Kafka to be ready
        run: |
          timeout=30
          until docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list || [ $timeout -le 0 ]; do
            echo "Waiting for Kafka..."
            echo "Containers Status:"
            docker ps -a
            echo "Kafka Container Logs:"
            docker logs kafka
            sleep 1
            ((timeout--))
          done
          if [ $timeout -le 0 ]; then
            echo "Timed out waiting for Kafka"
            exit 1
          fi

      - name: Build and Test
        run: mvn -B verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: notification-service/target/surefire-reports/

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose-ci.yml down -v