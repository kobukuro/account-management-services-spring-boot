name: Authn Service

on:
  pull_request:
    paths:
      - '.github/workflows/authn-service.yml'
      - 'authn-service/**'
  push:
    branches: [ main, dev ]
    paths:
      - '.github/workflows/authn-service.yml'
      - 'authn-service/**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERIFICATION_TOKEN_EXPIRATION_MILLISECONDS: ${{ secrets.VERIFICATION_TOKEN_EXPIRATION_MILLISECONDS }}
      ACCESS_TOKEN_EXPIRATION_MILLISECONDS: ${{ secrets.ACCESS_TOKEN_EXPIRATION_MILLISECONDS }}
      REFRESH_TOKEN_EXPIRATION_MILLISECONDS: ${{ secrets.REFRESH_TOKEN_EXPIRATION_MILLISECONDS }}
      RESET_PASSWORD_TOKEN_EXPIRATION_MILLISECONDS: ${{ secrets.RESET_PASSWORD_TOKEN_EXPIRATION_MILLISECONDS }}
      GOOGLE_OAUTH2_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH2_CLIENT_ID }}
      GOOGLE_OAUTH2_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}
      AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      FILE_UPLOAD_MAX_SIZE_MB: ${{ secrets.FILE_UPLOAD_MAX_SIZE_MB }}
      FILE_UPLOAD_PROFILE_PICTURE_MAX_WIDTH: ${{ secrets.FILE_UPLOAD_PROFILE_PICTURE_MAX_WIDTH }}
      FILE_UPLOAD_PROFILE_PICTURE_MAX_HEIGHT: ${{ secrets.FILE_UPLOAD_PROFILE_PICTURE_MAX_HEIGHT }}
      FILE_STORAGE_PRESIGNED_URL_EXPIRATION_HOURS: ${{ secrets.FILE_STORAGE_PRESIGNED_URL_EXPIRATION_HOURS }}

    defaults:
      run:
        working-directory: ./authn-service

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Docker Compose
        run: docker compose -f docker-compose-ci.yml up -d

      - name: Wait for database to be ready
        run: |
          timeout=30
          until docker compose -f docker-compose-ci.yml exec -T db pg_isready || [ $timeout -le 0 ]; do
            echo "Waiting for PostgreSQL... (${timeout}s remaining)"
            sleep 1
            ((timeout--))
          done
          if [ $timeout -le 0 ]; then
            echo "Timed out waiting for PostgreSQL"
            exit 1
          fi

      - name: Wait for Kafka to be ready
        run: |
          timeout=30
          until docker compose -f docker-compose-ci.yml exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list || [ $timeout -le 0 ]; do
            echo "Waiting for Kafka... (${timeout}s remaining)"
            sleep 1
            ((timeout--))
          done
          if [ $timeout -le 0 ]; then
            echo "Timed out waiting for Kafka"
            echo "=== Containers Status ==="
            docker ps -a
            echo "=== Kafka Container Logs ==="
            docker compose -f docker-compose-ci.yml logs kafka
            exit 1
          fi

      - name: Build and Test
        run: mvn -B verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: authn-service/target/surefire-reports/

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            authn-service/target/site/jacoco/
            authn-service/target/jacoco.exec

      - name: Generate Coverage Summary
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract coverage percentages from JaCoCo HTML report
          if [ -f target/site/jacoco/index.html ]; then
            echo "Coverage report generated successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the full coverage report from the artifacts." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 View detailed coverage in the 'coverage-reports' artifact" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./authn-service/target/site/jacoco/jacoco.xml
          flags: authn-service
          name: authn-service-coverage

      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@v4.9
        with:
          coverage_results_path: authn-service/target/site/jacoco/jacoco.xml
          coverage_report_name: Coverage
          coverage_report_title: JaCoCo Coverage Report
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: false
          publish_only_summary: false

      - name: Add Coverage Comment
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: |
            ${{ github.workspace }}/authn-service/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose-ci.yml down -v