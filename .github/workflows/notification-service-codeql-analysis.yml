name: "Notification Service CodeQL Security Analysis"

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'notification-service/**'
      - '.github/workflows/notification-service-codeql-analysis.yml'
  pull_request:
    paths:
      - 'notification-service/**'
      - '.github/workflows/notification-service-codeql-analysis.yml'
  schedule:
    # Run every Monday at 00:00 UTC (weekly scan)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  analyze:
    name: Analyze Notification Service
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required for CodeQL to upload results to GitHub
      security-events: write
      # Required to fetch code
      contents: read
      # Required for private repos
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Specify additional queries for more thorough security analysis
          queries: +security-extended,security-and-quality
          # Limit to notification-service only
          config: |
            paths:
              - notification-service/src/main
            paths-ignore:
              - notification-service/src/test
              - '**/target/**'

      - name: Build notification-service
        working-directory: ./notification-service
        run: |
          # Build without running tests to speed up CodeQL analysis
          mvn -B clean package -DskipTests -Dmaven.javadoc.skip=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}/service:notification-service"
          # Upload results even if there are errors
          upload: true

      - name: Add analysis summary
        if: always()
        run: |
          echo "## 🔒 CodeQL Security Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ CodeQL has analyzed the Notification Service for security vulnerabilities." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Analysis Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** notification-service" >> $GITHUB_STEP_SUMMARY
          echo "- **Language:** Java 21" >> $GITHUB_STEP_SUMMARY
          echo "- **Queries:** Security Extended + Quality" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 View results in the **Security** tab → **Code scanning alerts**" >> $GITHUB_STEP_SUMMARY
