name: API Gateway CI

on:
  pull_request:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yml'
  push:
    branches: [ main, dev ]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    defaults:
      run:
        working-directory: ./api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Redis with Docker Compose
        run: docker compose up -d

      - name: Wait for Redis to be ready
        run: |
          echo "Waiting for Redis to be ready..."
          timeout=120
          elapsed=0
          interval=2
          
          until docker compose exec -T redis redis-cli -a "${REDIS_PASSWORD}" ping | grep -q PONG; do
          if [ $elapsed -ge $timeout ]; then
          echo "Redis failed to become ready after ${timeout} seconds"
          docker compose logs redis
          exit 1
          fi
          echo "Waiting for Redis... (${elapsed}s/${timeout}s)"
          sleep $interval
          elapsed=$((elapsed + interval))
          done
          echo "Redis is ready!"

      - name: Verify Redis connection
        run: docker compose exec -T redis redis-cli -a "${REDIS_PASSWORD}" INFO server | grep redis_version

      - name: Build and Test
        run: mvn -B verify

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: api-gateway/target/surefire-reports/

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            api-gateway/target/site/jacoco/
            api-gateway/target/jacoco.exec

      - name: Generate Coverage Summary
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract coverage percentages from JaCoCo HTML report
          if [ -f target/site/jacoco/index.html ]; then
            echo "Coverage report generated successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the full coverage report from the artifacts." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 View detailed coverage in the 'coverage-reports' artifact" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./api-gateway/target/site/jacoco/jacoco.xml
          flags: api-gateway
          name: api-gateway-coverage

      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        uses: PavanMudigonda/jacoco-reporter@v4.9
        with:
          coverage_results_path: api-gateway/target/site/jacoco/jacoco.xml
          coverage_report_name: Coverage
          coverage_report_title: JaCoCo Coverage Report
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: false
          publish_only_summary: false

      - name: Add Coverage Comment
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: |
            ${{ github.workspace }}/api-gateway/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v
