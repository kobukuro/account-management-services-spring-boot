spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devdb
    username: devuser
    password: changeme
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true # Set this to true, so it can work properly even if the flyway_schema_history table does not exist and the database is not empty.
    enabled: true
    baseline-version: 1 # When the existing database is not empty, the current version will be set to this value.
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: localhost:9092
    producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        properties:
            spring.json.type.mapping: event:com.peter.authnservice.domain.event.Event
secret-key: ${SECRET_KEY}
jwt:
  verification:
    expiration: ${VERIFICATION_TOKEN_EXPIRATION_MILLISECONDS}
  access:
    expiration: ${ACCESS_TOKEN_EXPIRATION_MILLISECONDS}
  refresh:
    expiration: ${REFRESH_TOKEN_EXPIRATION_MILLISECONDS}
  reset-password:
    expiration: ${RESET_PASSWORD_TOKEN_EXPIRATION_MILLISECONDS}
frontend-url: ${FRONTEND_URL}
app-name: ${APP_NAME}
springdoc:
  api-docs:
    enabled: true
    path: /authn/v1/api-docs
  swagger-ui:
    enabled: true
    path: /authn/swagger-ui.html
allowed-origins: ${ALLOWED_ORIGINS}
google:
  oauth2:
    client-id: ${GOOGLE_OAUTH2_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET}