spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: devuser
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false  # Allow database cleanup in test environment
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: event:com.peter.authnservice.domain.event.Event
secret-key: "test-secret-key-for-ci-environment"
jwt:
  verification:
    expiration: ${VERIFICATION_TOKEN_EXPIRATION_MILLISECONDS}
  access:
    expiration: ${ACCESS_TOKEN_EXPIRATION_MILLISECONDS}
  refresh:
    expiration:  ${REFRESH_TOKEN_EXPIRATION_MILLISECONDS}
  reset-password:
    expiration: ${RESET_PASSWORD_TOKEN_EXPIRATION_MILLISECONDS}
frontend-url: "test-frontend-url-for-ci-environment"
app-name: "test-app-name-for-ci-environment"

google:
  oauth2:
    client-id: ${GOOGLE_OAUTH2_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET}

trusted-proxy-ips: ${TRUSTED_PROXY_IPS:127.0.0.1,::1}

test:
  kafka:
    max-poll-iterations: 20

aws:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_S3_REGION}
    bucket-name: ${AWS_S3_BUCKET_NAME}

file:
  upload:
    max-size-mb: ${FILE_UPLOAD_MAX_SIZE_MB:5}
    profile-picture:
      max-width: ${FILE_UPLOAD_PROFILE_PICTURE_MAX_WIDTH:400}
      max-height: ${FILE_UPLOAD_PROFILE_PICTURE_MAX_HEIGHT:400}
  storage:
    presigned-url-expiration-hours: ${FILE_STORAGE_PRESIGNED_URL_EXPIRATION_HOURS:24}