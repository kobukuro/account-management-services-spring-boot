spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: devuser
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false  # Allow database cleanup in test environment
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: event:com.peter.authnservice.domain.event.UserRegistrationEvent
secret-key: "test-secret-key-for-ci-environment"
jwt:
  verification:
    expiration: ${VERIFICATION_TOKEN_EXPIRATION_MILLISECONDS}
frontend-url: "test-frontend-url-for-ci-environment"
app-name: "test-app-name-for-ci-environment"